name: Release mod zip

# Builds the zip ready to install in the game (extract it into
# %APPDATA%\Captain of Industry\Mods) and attaches it to the GitHub release of the version
# in manifest.json. Runs only for the master branch and needs no secrets: it uses the
# workflow's built-in GITHUB_TOKEN.
#
# GitHub cannot compile the mod (that needs the game's DLLs), so the compiled DLL comes from
# dist/GeologyReservoirEngineering.dll in the repository: a Release build copies it there, commit it together with
# the version bump in manifest.json.
#
#  - push to master: creates a DRAFT release "<version>" with the zip (or refreshes the zip
#    if the release already exists). Write the notes and publish it.
#  - release published from master: refreshes the zip.
#  - manual run (Actions -> Release mod zip -> Run workflow, branch master): same as a push.

on:
  push:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: .
      DIST: dist
      DLL: GeologyReservoirEngineering.dll
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch
        id: branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag='${{ github.event.release.tag_name }}'
            git checkout -q "$tag"
            if git merge-base --is-ancestor HEAD origin/master; then ok=true; else ok=false; fi
          else
            if [ "$GITHUB_REF" = "refs/heads/master" ]; then ok=true; else ok=false; fi
          fi
          if [ "$ok" != true ]; then
            echo "::notice::Not on the master branch: no zip is built."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Build zip
        if: steps.branch.outputs.ok == 'true'
        run: |
          set -euo pipefail
          id=$(jq -r .id "$SRC/manifest.json")
          version=$(jq -r .version "$SRC/manifest.json")
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag='${{ github.event.release.tag_name }}'
          else
            tag="$version"
          fi
          if [ "${tag#v}" != "$version" ]; then
            echo "::warning::Release $tag does not match manifest.json version $version"
          fi

          if [ ! -f "$DIST/$DLL" ]; then
            echo "::error::$DIST/$DLL is missing. Build the mod in Release (it is copied there automatically) and commit it."
            exit 1
          fi

          out="stage/$id"
          mkdir -p "$out"
          cp "$SRC/manifest.json" "$DIST/$DLL" "$out/"
          if [ -f "$SRC/Thumbnail.png" ]; then cp "$SRC/Thumbnail.png" "$out/"; fi
          if [ -d "$SRC/Translations" ]; then cp -r "$SRC/Translations" "$out/"; fi
          if [ -d "$SRC/AssetBundles" ]; then cp -r "$SRC/AssetBundles" "$out/"; fi
          # Harmony ships with the mod (listed in manifest.json primary_dlls).
          cp "$SRC/Libs/0Harmony.dll" "$out/"
          zip="${id}_${version}.zip"
          # The zip contains the <mod id> folder itself: extract it into the Mods folder.
          (cd stage && zip -r -9 "../$zip" "$id")
          unzip -l "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Attach zip to release
        if: steps.branch.outputs.ok == 'true'
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            echo "Zip attached to release $TAG"
          else
            gh release create "$TAG" "$ZIP" --draft --target master --title "$TAG" --notes ""
            echo "::notice::Draft release $TAG created with the zip: write the notes and publish it."
          fi
