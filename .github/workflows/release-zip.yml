name: Release mod zip

# Compiles the mod, builds the zip ready to install (extract it into
# %APPDATA%\Captain of Industry\Mods) and attaches it to the GitHub release of the version
# in manifest.json. Runs only for the master branch and needs no secrets: it uses the
# workflow's built-in GITHUB_TOKEN.
#
# Compiling needs the game's DLLs, which the modding policy forbids redistributing, so the
# job runs on a self-hosted runner: your own Windows PC with the game installed (see
# "Release zip" in README.md for the one-time setup).
#
#  - push to master: creates a DRAFT release "<version>" with the zip, or refreshes the zip
#    if that release already exists. Write the notes and publish it.
#  - manual run: Actions -> Release mod zip -> Run workflow, branch master.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-zip
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: [ self-hosted, Windows, coi ]
    env:
      SRC: .
      PROJECT: GeologyReservoirEngineering.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Check game install
        shell: powershell
        run: |
          if (-not $env:COI_ROOT -or -not (Test-Path (Join-Path $env:COI_ROOT 'Captain of Industry_Data\Managed\Mafi.Core.dll'))) {
            Write-Error "COI_ROOT is not set to the game install folder on this runner (current value: '$env:COI_ROOT'). See 'Release zip' in README.md."
            exit 1
          }

      - name: Build
        shell: powershell
        run: |
          # The project's own deploy step copies exactly the files the game needs into
          # <COI_MODS>\<mod id>\: point it at a staging folder instead of the real Mods folder.
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          dotnet build $env:PROJECT -c Release -p:DeployToModsFolder=true "-p:COI_MODS=$stage"
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Build zip
        shell: powershell
        run: |
          $m = Get-Content -Raw (Join-Path $env:SRC 'manifest.json') | ConvertFrom-Json
          $modDir = Join-Path $env:RUNNER_TEMP "stage\$($m.id)"
          if (-not (Test-Path (Join-Path $modDir 'manifest.json'))) { throw "Build output not found in $modDir" }
          $zip = Join-Path $env:RUNNER_TEMP "$($m.id)_$($m.version).zip"
          # The zip contains the <mod id> folder itself: extract it into the Mods folder.
          Compress-Archive -Path $modDir -DestinationPath $zip -Force
          Get-ChildItem -Recurse $modDir | ForEach-Object { $_.FullName.Substring($modDir.Length + 1) }
          # Windows PowerShell's Out-File -Encoding utf8 writes a BOM, which GITHUB_ENV rejects.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ZIP=$zip`nTAG=$($m.version)`n")

      - name: Attach zip to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          # Look for the release of this version, drafts included.
          $release = $null
          for ($page = 1; -not $release; $page++) {
            # ForEach-Object unrolls the JSON array (Windows PowerShell returns it as one object).
            $list = @((Invoke-RestMethod -Headers $headers -Uri "$api/releases?per_page=100&page=$page") | ForEach-Object { $_ })
            if ($list.Count -eq 0) { break }
            $release = $list | Where-Object { $_.tag_name -eq $env:TAG -or $_.tag_name -eq "v$env:TAG" } | Select-Object -First 1
          }
          if (-not $release) {
            $body = @{ tag_name = $env:TAG; target_commitish = $env:GITHUB_SHA; name = $env:TAG; body = ''; draft = $true } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -Uri "$api/releases" -Body $body -ContentType 'application/json'
            Write-Host "::notice::Draft release $env:TAG created: write the notes and publish it."
          }

          $name = Split-Path $env:ZIP -Leaf
          foreach ($asset in @($release.assets | Where-Object { $_.name -eq $name })) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/assets/$($asset.id)"
          }
          $upload = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
          Invoke-RestMethod -Method Post -Headers $headers -Uri $upload -InFile $env:ZIP -ContentType 'application/zip' | Out-Null
          Write-Host "Attached $name to release $($release.tag_name)"
